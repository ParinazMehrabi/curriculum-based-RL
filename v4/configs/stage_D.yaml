# Stage D -- chain the sub-movements into continuous gait, at reference speed.
#
# Stage B holds the four keyframe poses, stage C moves from one to the next, and
# stage D repeats that: each time posture crosses chain_advance_threshold (0.60)
# the target advances to the following keyframe, so a single episode walks
#
#     crutch_r -> leg_l -> crutch_l -> leg_r -> crutch_r -> ...
#
# for as long as the model keeps arriving. env.chain_transitions counts how many
# it managed. One transition is stage C's entire task, so anything above four
# means a full gait cycle was walked.
#
# The chain follows the gait CYCLE, not the order the windows appear in the
# record. leg_r has a single window because its second occurrence falls past the
# end of the file, so walking the record in order would skip the right-leg step
# every other cycle -- a limp rather than a gait.
#
# Speed is a consequence of chaining quickly, so velocity sits at 0.20 as a
# tiebreaker while posture (0.45) and pelvis_forward (0.30) carry the task.
# target_vel is the reference's own 0.142 m/s and displacement_cap is 2.0 m,
# since a full episode at that speed covers 1.42 m.
#
# crutch_forward and pelvis_lag are dropped. They came from the older
# posture-fix design, neither ever ran in training, and the chained pose targets
# already say where the crutches and pelvis should be.
#
# Stage configuration lives in sconegym_crutch_v4/stages.py, not in this file.
# To change a coefficient, edit stages.py or register a variant in the header:
#
#   header: >
#     import deprl, gym, sconegym, sconegym_crutch_v4;
#     sconegym_crutch_v4.register_variant('D', 'stage_d_t50-v1', rsi_chain_advance_threshold=0.50)

tonic:
  header: "import deprl, gym, sconegym, sconegym_crutch_v4"

  agent: >
    deprl.custom_agents.dep_factory(
      3,
      deprl.custom_mpo_torch.TunedMPO()
    )(
      replay=deprl.custom_replay_buffers.AdaptiveEnergyBuffer(
        return_steps=1,
        batch_size=256,
        steps_between_batches=1000,
        batch_iterations=30,
        steps_before_batches=200000,
        num_acts=9
      )
    )

  environment: >
    deprl.environments.Gym(
      'sconewalk_crutch_v4_staged-v1',
      scaled_actions=False
    )

  test_environment: null

  # Warm-start from stage C, which learned a single keyframe transition.
  #
  # REPLACE THE PATH BELOW with your stage C run and its last checkpoint. Find
  # both with:
  #   python scripts/eval_checkpoint.py --stage C
  # which prints the run directory and the checkpoint range it can see.
  #
  # Verify the load worked by watching epoch 1: a warm-started run starts near
  # where stage C's policy scores, not near 45. Checking that one number costs
  # nothing and catches a silently failed load before it wastes a day.
  before_training: >
    agent.load(
      r'REPLACE_WITH_YOUR_STAGE_C_RUN\checkpoints\step_XXXXXXX',
      only_checkpoint=True
    )
  after_training: ''

  checkpoint: last
  full_save: 1

  name: crutch_v4_stage_D_chain
  resume: false
  seed: 0
  parallel: 20
  sequential: 10

  # epoch_steps is the logging cadence: tonic prints a metrics table and runs a
  # test episode at the end of every epoch. 10000 gives reward roughly every 10k
  # environment steps. Raise it to 25000 if the test episodes cost too much wall
  # clock; save_steps stays at 100000 so checkpoints do not multiply.
  trainer: >
    deprl.custom_trainer.Trainer(
      steps=int(10000000),
      epoch_steps=int(10000),
      save_steps=int(100000)
    )

working_dir: IGNORED_FOR_HYFYDY

DEP:
  bias_rate: .002
  buffer_size: 200
  intervention_length: 8
  intervention_proba: .0005
  kappa: 50
  normalization: independent
  q_norm_selector: l2
  regularization: 8
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 20
  time_dist: 5
  with_learning: true
