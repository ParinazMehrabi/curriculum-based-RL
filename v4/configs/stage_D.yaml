# Stage D -- crutch placement and trunk-over-feet correction. Warm-starts from C.
#
# Same RSI as A, B and C, and the same widened hip_knee_sigma (0.60) as C, since
# this stage also has to stride.
#
# New this stage: crutch_forward (0.20), pelvis_lag (0.20) and pelvis_forward
# (0.30), with the crutch load target lowered from 15% to 8% of body weight --
# the model should now rely on the crutches less.
#
# The weights were rebalanced toward moving. As first written, standing
# perfectly still scored about 0.79/step against 0.95 for walking at target: a
# 17% gap for behaviour that is much harder and risks the -5.0 fall penalty, so
# standing was the rational choice. posture, backward, displacement,
# crutch_forward and pelvis_lag are all maximised by staying put, which was 49%
# of the weight, while only velocity (0.25) rewarded motion.
#
# velocity is now 0.60, backward is down to 0.25 (it returns 1.0 for any v >= 0,
# so a motionless model satisfies it perfectly), and pelvis_forward is back at
# 0.30 as the only term that rewards distance actually covered. Standing still
# now scores about 0.53 against 1.00 for walking -- a 47% gap.
#
# Both new terms measure deviation from offsets taken at the episode's own start
# frame, not from the neutral pose: the pelvis-to-foot gap swings through the
# stride, so a fixed reference would be wrong on most frames. Neither term has
# ever been exercised in training, so watch them in the first eval.
#
# Stage configuration (reward weights, sigmas, reset distribution) lives in
# sconegym_crutch_v4/stages.py, NOT in this file. v3 carried an env_args block
# here, but nothing in the package ever read it and it was never confirmed that
# tonic forwards it to the environment. To change a coefficient, either edit
# stages.py or register a variant in the header, e.g.:
#
#   header: >
#     import deprl, gym, sconegym, sconegym_crutch_v4;
#     sconegym_crutch_v4.register_variant('D', 'stage_d_tuned-v1', w_posture=0.55)
#
# and then point `environment` at 'stage_d_tuned-v1'. Unknown override names
# raise immediately.

tonic:
  header: "import deprl, gym, sconegym, sconegym_crutch_v4"

  agent: >
    deprl.custom_agents.dep_factory(
      3,
      deprl.custom_mpo_torch.TunedMPO()
    )(
      replay=deprl.custom_replay_buffers.AdaptiveEnergyBuffer(
        return_steps=1,
        batch_size=256,
        steps_between_batches=1000,
        batch_iterations=30,
        steps_before_batches=200000,
        num_acts=9
      )
    )

  environment: >
    deprl.environments.Gym(
      'sconewalk_crutch_v4_staged-v1',
      scaled_actions=False
    )

  test_environment: null

  # Warm-start checkpoint. Fill this in with the run you actually want to
  # continue from, as a path relative to the repository root where possible.
  #
  # Two warnings:
  #  1. v3 checkpoints are NOT loadable here. prev_action is now part of the
  #     observation, so the observation dimension changed by +9 and the actor
  #     input layer no longer matches. Either retrain the curriculum from
  #     stage A, or construct with include_prev_action=False to keep the old
  #     observation layout (and the non-Markov behaviour it causes).
  #  2. The reward function changes at this boundary, so the critic arrives
  #     mis-calibrated. Expect a dip. A critic warm-up or return
  #     normalisation is the next thing worth adding here.
  # Stage C run 260913.120005 finished 10M steps: last-10-epoch mean 634,
  # best 717, episode_length pinned at 1000. Its step_500000 policy already had
  # posture 0.69, crutch 0.89, zero falls.
  #
  # VERIFY THIS CHECKPOINT EXISTS. Stage A stopped writing checkpoints at 5.7M
  # despite training to 10M, so the last file may be earlier than the last step.
  # Check with:
  #   python scripts/eval_checkpoint.py --stage C
  # which prints the checkpoint range, then set the number below to match.
  before_training: >
    agent.load(
      r'C:\Users\FUM Care\Documents\SCONE\results\crutch_v4_stage_C_tiny_forward\260913.120005.Rajagopal2015_crutch_2D_ankles_locked_mesh_lumbar\checkpoints\step_10000000',
      only_checkpoint=True
    )
  after_training: ''

  checkpoint: last
  full_save: 1

  name: crutch_v4_stage_D_posture_fix
  resume: false
  seed: 0
  parallel: 20
  sequential: 10

  # epoch_steps is the logging cadence: tonic prints a metrics table and runs
  # a test episode at the end of every epoch. 10000 gives reward roughly every
  # 10k environment steps. Raise it to 25000 if the test episodes cost too much
  # wall clock; save_steps stays at 100000 so checkpoints do not multiply.
  trainer: >
    deprl.custom_trainer.Trainer(
      steps=int(10000000),
      epoch_steps=int(10000),
      save_steps=int(100000)
    )

working_dir: IGNORED_FOR_HYFYDY

DEP:
  bias_rate: .002
  buffer_size: 200
  intervention_length: 8
  intervention_proba: .0005
  kappa: 50
  normalization: independent
  q_norm_selector: l2
  regularization: 8
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 20
  time_dist: 5
  with_learning: true
