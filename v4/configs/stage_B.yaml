# Stage B -- standing with crutch load sharing. Warm-starts from stage A.
#
# Stage B uses the SAME reference-state initialisation as stage A (same
# trajectory, velocity_scale 0.0, posture_reference "init"), so crutch load is
# the only new axis. Stage A learned to hold the reference's forward-leaning
# poses; resetting upright here and scoring posture against upright would change
# the initial-state distribution, the posture reference and the reward at once.
#
# New this stage: crutch load sharing at 15% of body weight (95 N of 631 N),
# sigma fraction 0.15, gated by a smoothstep over 10-30 N of contact force. The
# environment refuses to construct if the crutch force API is not working.
#
# Stage configuration (reward weights, sigmas, reset distribution) lives in
# sconegym_crutch_v4/stages.py, NOT in this file. v3 carried an env_args block
# here, but nothing in the package ever read it and it was never confirmed that
# tonic forwards it to the environment. To change a coefficient, either edit
# stages.py or register a variant in the header, e.g.:
#
#   header: >
#     import deprl, gym, sconegym, sconegym_crutch_v4;
#     sconegym_crutch_v4.register_variant('B', 'stage_b_tuned-v1', w_posture=0.55)
#
# and then point `environment` at 'stage_b_tuned-v1'. Unknown override names
# raise immediately.

tonic:
  header: "import deprl, gym, sconegym, sconegym_crutch_v4"

  agent: >
    deprl.custom_agents.dep_factory(
      3,
      deprl.custom_mpo_torch.TunedMPO()
    )(
      replay=deprl.custom_replay_buffers.AdaptiveEnergyBuffer(
        return_steps=1,
        batch_size=256,
        steps_between_batches=1000,
        batch_iterations=30,
        steps_before_batches=200000,
        num_acts=9
      )
    )

  environment: >
    deprl.environments.Gym(
      'sconewalk_crutch_v4_stageb-v1',
      scaled_actions=False
    )

  test_environment: null

  # Warm-start checkpoint. Fill this in with the run you actually want to
  # continue from, as a path relative to the repository root where possible.
  #
  # Two warnings:
  #  1. v3 checkpoints are NOT loadable here. prev_action is now part of the
  #     observation, so the observation dimension changed by +9 and the actor
  #     input layer no longer matches. Either retrain the curriculum from
  #     stage A, or construct with include_prev_action=False to keep the old
  #     observation layout (and the non-Markov behaviour it causes).
  #  2. The reward function changes at this boundary, so the critic arrives
  #     mis-calibrated. Expect a dip. A critic warm-up or return
  #     normalisation is the next thing worth adding here.
  # Stage A run 260912.135956 plateaued near episode_score 550 with
  # episode_length pinned at 1000: it holds all 301 reference poses for a full
  # 10 s. step_5600000 scored 609 at length 1000 and sits inside a stable
  # window, which is the selection criterion -- not the single best epoch
  # (762 at 5.43M, which is not a save point anyway).
  #
  # VERIFY THIS PATH EXISTS FIRST. It is machine-specific, the same wart v3 had.
  before_training: >
    agent.load(
      r'C:\Users\FUM Care\Documents\SCONE\results\crutch_v4_stage_A_stand\260912.135956.Rajagopal2015_crutch_2D_ankles_locked_mesh_lumbar\checkpoints\step_5600000',
      only_checkpoint=True
    )
  after_training: ''

  checkpoint: last
  full_save: 1

  name: crutch_v4_stage_B_stand_crutch
  resume: false
  seed: 0
  parallel: 20
  sequential: 10

  # epoch_steps is the logging cadence: tonic prints a metrics table and runs
  # a test episode at the end of every epoch. 10000 gives reward roughly every
  # 10k environment steps. Raise it to 25000 if the test episodes cost too much
  # wall clock; save_steps stays at 100000 so checkpoints do not multiply.
  trainer: >
    deprl.custom_trainer.Trainer(
      steps=int(10000000),
      epoch_steps=int(10000),
      save_steps=int(100000)
    )

working_dir: IGNORED_FOR_HYFYDY

DEP:
  bias_rate: .002
  buffer_size: 200
  intervention_length: 8
  intervention_proba: .0005
  kappa: 50
  normalization: independent
  q_norm_selector: l2
  regularization: 8
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 20
  time_dist: 5
  with_learning: true
