# Stage A -- balance from reference-state initialisation. Trains from scratch.
#
# Episodes start at a uniformly random frame of
# models/reference/gaitTracking_solution_raw.sto (an OpenSim Moco tracking
# solution, 301 frames, 6.4 s, mean forward speed 0.142 m/s) rather than always
# from the neutral pose, and the task is to hold whatever pose the model was
# dropped into.
#
# rsi_velocity_scale is 0.0, so the pose arrives at rest. That is the balance
# task. Raise it toward 1.0 to fade in the reference's mid-stride momentum,
# which turns this into catch-and-recover:
#
#   header: >
#     import deprl, gym, sconegym, sconegym_crutch_v4;
#     sconegym_crutch_v4.register_variant('A', 'stage_a_v25-v1', rsi_velocity_scale=0.25)
#
# posture_reference is "init" because the reference leans 19-31 degrees forward
# throughout; measured against an upright ideal the posture term would score
# about 0.0004 on every frame.
#
# Stage configuration (reward weights, sigmas, reset distribution) lives in
# sconegym_crutch_v4/stages.py, NOT in this file. v3 carried an env_args block
# here, but nothing in the package ever read it and it was never confirmed that
# tonic forwards it to the environment. To change a coefficient, either edit
# stages.py or register a variant in the header, e.g.:
#
#   header: >
#     import deprl, gym, sconegym, sconegym_crutch_v4;
#     sconegym_crutch_v4.register_variant('A', 'stage_a_tuned-v1', w_posture=0.55)
#
# and then point `environment` at 'stage_a_tuned-v1'. Unknown override names
# raise immediately.

tonic:
  header: "import deprl, gym, sconegym, sconegym_crutch_v4"

  agent: >
    deprl.custom_agents.dep_factory(
      3,
      deprl.custom_mpo_torch.TunedMPO()
    )(
      replay=deprl.custom_replay_buffers.AdaptiveEnergyBuffer(
        return_steps=1,
        batch_size=256,
        steps_between_batches=1000,
        batch_iterations=30,
        steps_before_batches=200000,
        num_acts=9
      )
    )

  environment: >
    deprl.environments.Gym(
      'sconewalk_crutch_v4_stagea-v1',
      scaled_actions=False
    )

  test_environment: null

  before_training: ''
  after_training: ''

  checkpoint: last
  full_save: 1

  name: crutch_v4_stage_A_stand
  resume: false
  seed: 0
  parallel: 20
  sequential: 10

  trainer: >
    deprl.custom_trainer.Trainer(
      steps=int(10000000),
      epoch_steps=int(100000),
      save_steps=int(100000)
    )

working_dir: IGNORED_FOR_HYFYDY

DEP:
  bias_rate: .002
  buffer_size: 200
  intervention_length: 8
  intervention_proba: .0005
  kappa: 50
  normalization: independent
  q_norm_selector: l2
  regularization: 8
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 20
  time_dist: 5
  with_learning: true
