# Stage C -- tiny forward locomotion with the crutch. Warm-starts from stage B.
#
# Stage C learns the TRANSITIONS between the gait keyframes. It samples the
# same four sub-movements as stage B, but posture now targets the NEXT keyframe
# instead of the one the episode starts at:
#
#     crutch_r -> leg_l -> crutch_l -> leg_r -> crutch_r ...
#
# B learned to hold the four poses; C learns to move from each to the following
# one. That is the single new axis at this boundary -- sampling, trajectory and
# velocity_scale are all unchanged from B.
#
# The episode still runs 1000 steps, so the task is reach the next pose and then
# hold it. Holding is what stage B trained, so the warm start carries.
#
# hip_knee_sigma is widened to 0.60 for this stage. posture measures hip and
# knee deviation from the reference frame, and a stride moves hip flexion by
# roughly 0.6 rad. At the standing value of 0.35 the 0.45-weighted posture term
# would score about 0.05 for any real step, opposing the velocity term it shares
# the reward with. Revert to 0.35 if C walks but stops tracking the reference
# legs at all.
#
# New this stage: velocity toward 0.03 m/s (sigma fraction 0.7), a backward gate
# and a displacement cap at 0.5 m.
#
# Stage configuration (reward weights, sigmas, reset distribution) lives in
# sconegym_crutch_v4/stages.py, NOT in this file. v3 carried an env_args block
# here, but nothing in the package ever read it and it was never confirmed that
# tonic forwards it to the environment. To change a coefficient, either edit
# stages.py or register a variant in the header, e.g.:
#
#   header: >
#     import deprl, gym, sconegym, sconegym_crutch_v4;
#     sconegym_crutch_v4.register_variant('C', 'stage_c_tuned-v1', w_posture=0.55)
#
# and then point `environment` at 'stage_c_tuned-v1'. Unknown override names
# raise immediately.

tonic:
  header: "import deprl, gym, sconegym, sconegym_crutch_v4"

  agent: >
    deprl.custom_agents.dep_factory(
      3,
      deprl.custom_mpo_torch.TunedMPO()
    )(
      replay=deprl.custom_replay_buffers.AdaptiveEnergyBuffer(
        return_steps=1,
        batch_size=256,
        steps_between_batches=1000,
        batch_iterations=30,
        steps_before_batches=200000,
        num_acts=9
      )
    )

  environment: >
    deprl.environments.Gym(
      'sconewalk_crutch_v4_stagec-v1',
      scaled_actions=False
    )

  test_environment: null

  # Warm-start checkpoint. Fill this in with the run you actually want to
  # continue from, as a path relative to the repository root where possible.
  #
  # Two warnings:
  #  1. v3 checkpoints are NOT loadable here. prev_action is now part of the
  #     observation, so the observation dimension changed by +9 and the actor
  #     input layer no longer matches. Either retrain the curriculum from
  #     stage A, or construct with include_prev_action=False to keep the old
  #     observation layout (and the non-Markov behaviour it causes).
  #  2. The reward function changes at this boundary, so the critic arrives
  #     mis-calibrated. Expect a dip. A critic warm-up or return
  #     normalisation is the next thing worth adding here.
  # Warm-start from stage B run 260914.192317, 10M steps, all 100 checkpoints
  # written. Its step_10000000 policy evaluated at:
  #
  #     posture 0.1725   crutch 0.6763   height 0.8387
  #     1000 steps every episode, 0 falls in 10, crutch load 24.5% BW
  #
  # The crutch and height terms transferred well and the policy is stable. But
  # posture -- B's actual task, holding the pose it was dropped into -- came out
  # at 0.17, and the per-episode spread tracks the sub-movement: crutch_l scored
  # 702 while leg_r scored 368. The leg-forward keyframes have a limb mid-swing
  # with one foot barely loaded, so they are not statically stable and "hold
  # this pose" asks for something the dynamics will not permit.
  #
  # Stage C may therefore be BETTER posed than B: it asks the model to move to
  # the next pose, which is what the dynamics want to do anyway. That is the
  # assumption this run tests. If C's first eval also shows posture near 0.17,
  # the pose targets are simply too tight for this model and the fix is widening
  # pelvis_tilt_sigma / lumbar_sigma from 0.15 / 0.15:
  #
  #   python -c "import sconegym_crutch_v4 as s; s.register_variant('C','stage_c_wide-v1',pelvis_tilt_sigma=0.25,lumbar_sigma=0.25)"
  #
  # Verify the load worked by watching epoch 1: a warm-started run starts near
  # where stage B's policy scores, not near 45.
  before_training: >
    agent.load(
      r'C:\Users\FUM Care\Documents\SCONE\results\crutch_v4_stage_B_stand_crutch\260914.192317.Rajagopal2015_crutch_2D_ankles_locked_mesh_lumbar\checkpoints\step_10000000',
      only_checkpoint=True
    )
  after_training: ''

  checkpoint: last
  full_save: 1

  name: crutch_v4_stage_C_tiny_forward
  resume: false
  seed: 0
  parallel: 20
  sequential: 10

  # epoch_steps is the logging cadence: tonic prints a metrics table and runs
  # a test episode at the end of every epoch. 10000 gives reward roughly every
  # 10k environment steps. Raise it to 25000 if the test episodes cost too much
  # wall clock; save_steps stays at 100000 so checkpoints do not multiply.
  trainer: >
    deprl.custom_trainer.Trainer(
      steps=int(10000000),
      epoch_steps=int(10000),
      save_steps=int(100000)
    )

working_dir: IGNORED_FOR_HYFYDY

DEP:
  bias_rate: .002
  buffer_size: 200
  intervention_length: 8
  intervention_proba: .0005
  kappa: 50
  normalization: independent
  q_norm_selector: l2
  regularization: 8
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 20
  time_dist: 5
  with_learning: true
